name: WLSS 3D Video (Windows exe)

on:
  push:
    paths:
      - "apps/wlss3d/**"
      - ".github/workflows/wlss3d-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/wlss3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/wlss3d/requirements.txt
      - name: Dependencias
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Gerar o exe
        run: >
          pyinstaller --noconfirm --name WLSS3D
          --collect-all moderngl --collect-all glcontext
          --collect-binaries onnxruntime --collect-all _sounddevice_data
          run.py
      - name: Verificar que o exe abre
        run: dist\WLSS3D\WLSS3D.exe --help
      - name: Incluir ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\WLSS3D\ffmpeg.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WLSS3D-windows
          path: apps/wlss3d/dist/WLSS3D
